<header class="graph-toolbar">
  <a class="button" href="./">← Dashboard</a>
  <h1>Project graph</h1>
  <button
    class="theme-toggle"
    type="button"
    role="switch"
    aria-checked="true"
    aria-label="Dark mode"
    data-theme-toggle
  >
    <span>Dark mode</span
    ><span class="theme-toggle-track" aria-hidden="true"><i></i></span>
  </button>
  <div class="graph-actions">
    <button class="button" id="local-projects" type="button">
      Demo workspace</button
    ><button class="button primary" id="reset-layout" type="button">
      Reset layout
    </button>
  </div>
</header>
