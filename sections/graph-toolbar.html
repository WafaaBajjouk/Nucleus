<header class="graph-toolbar">
  <a class="button" href="./">← Dashboard</a>
  <h1>Project graph</h1>
  <button
    class="theme-toggle"
    type="button"
    role="switch"
    aria-checked="true"
    aria-label="Dark mode"
    data-theme-toggle
  >
    <span>Dark mode</span
    ><span class="theme-toggle-track" aria-hidden="true"><i></i></span>
  </button>
  <div class="graph-actions">
    <button class="button" id="local-projects" type="button">
      Demo workspace</button
    ><button class="button primary" id="reset-layout" type="button">
      Reset layout
    </button>
  </div>
  <details class="github-settings">
    <summary>GitHub projects (token connection)</summary>
    <p class="github-note">
      Use a GitHub token to access your allowed repositories as projects.
      Configure the token on the server; no GitHub login is required.
    </p>
    <form id="github-import" class="github-import">
      <label for="github-username">GitHub username</label
      ><input
        id="github-username"
        name="username"
        placeholder="Username"
        required
        maxlength="39"
        autocomplete="off"
      /><button class="button" type="submit">Load projects</button>
    </form>
  </details>
</header>
