<header class="topbar">
  <div>Workspace <span>/</span><strong>Dashboard</strong></div>
  <div class="header-actions">
    <span class="environment">Local projects</span>
    <button
      class="theme-toggle"
      type="button"
      role="switch"
      aria-checked="true"
      aria-label="Dark mode"

      ><span class="theme-toggle-track" aria-hidden="true"><i></i></span>
    </button>
  </div>
</header>
