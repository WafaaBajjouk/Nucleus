<section
  class="panel instances"
  id="instances"
  aria-labelledby="instances-title"
>
  <div class="section-heading">
    <div>
      <h2 id="instances-title">My instances <span class="count">4</span></h2>
      <p>Your environments, at a glance.</p>
    </div>
    <label class="search"
      ><span aria-hidden="true">⌕</span
      ><input
        id="instance-search"
        type="search"
        placeholder="Search instances…"
        aria-label="Search instances"
      /><kbd>/</kbd></label
    >
  </div>
  <div class="filters" role="group" aria-label="Filter instances by status">
    <button class="filter selected" data-filter="all" aria-pressed="true">
      All instances <span>4</span></button
    ><button class="filter" data-filter="running" aria-pressed="false">
      Running <span>3</span></button
    ><button class="filter" data-filter="stopped" aria-pressed="false">
      Stopped <span>1</span>
    </button>
  </div>
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th scope="col">INSTANCE / PROJECT</th>
          <th scope="col">STATUS</th>
          <th scope="col">VERSION</th>
          <th scope="col">CPU</th>
          <th scope="col">MEMORY</th>
          <th scope="col">VERIFICATION</th>
        </tr>
      </thead>
      <tbody id="instance-rows"></tbody>
    </table>
  </div>
  <p id="empty-state" class="empty-state" hidden>
    No instances match your search.
  </p>
  <div class="table-footer">
    <span id="result-count" aria-live="polite">Showing 4 instances</span
    ><span>Sample environment data</span>
  </div>
</section>
