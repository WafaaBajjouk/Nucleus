<section id="projects" aria-labelledby="projects-title">
  <div class="section-heading">
    <div>
      <h2 id="projects-title">Your local projects</h2>
      <p>Read directly from the examples folder.</p>
    </div>
    <button class="button" id="refresh-projects" type="button">Refresh</button>
  </div>
  <label class="search" for="project-search"
    ><span aria-hidden="true">⌕</span
    ><input id="project-search" type="search" placeholder="Search projects…"
  /></label>
  <p id="project-status" class="project-status" role="status">
    Loading example projects…
  </p>
  <div class="project-grid" id="project-list" aria-busy="true"></div>
</section>
