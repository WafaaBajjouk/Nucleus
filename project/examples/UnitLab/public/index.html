<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UnitLab</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">SMALL TOOLS · REAL RESULTS</p>
      <h1>UnitLab</h1>
      <p class="intro">A simple distance converter.</p>
      <form id="converter">
        <label for="value">Distance</label
        ><input
          id="value"
          name="value"
          type="number"
          min="0"
          step="any"
          value="1"
          required
        />
        <div class="units">
          <div>
            <label for="from">From</label
            ><select id="from" name="from">
              <option value="km">Kilometers</option>
              <option value="m">Meters</option>
              <option value="ft">Feet</option>
              <option value="mi">Miles</option>
            </select>
          </div>
          <div>
            <label for="to">To</label
            ><select id="to" name="to">
              <option value="m">Meters</option>
              <option value="km">Kilometers</option>
              <option value="ft">Feet</option>
              <option value="mi">Miles</option>
            </select>
          </div>
        </div>
        <button type="submit">Convert distance</button>
      </form>
      <p id="result" role="status">Enter a distance and select Convert.</p>
      <footer>No account or saved data required.</footer>
    </main>
  </body>
</html>
