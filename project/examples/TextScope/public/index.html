<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TextScope</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">DEMO WORKSPACE · SMALL TOOLS</p>
      <h1>TextScope</h1>
      <p class="intro">
        Analyze text to count words, characters, lines and paragraphs.
      </p>
      <form id="tool">
        <label for="text">Paste text to analyze</label
        ><textarea id="text" name="text" rows="9">
Hello Nucleus!

A small project with useful results.</textarea
        ><button type="submit">Analyze text</button>
      </form>
      <p id="status" role="status">Ready when you are.</p>
      <pre id="result" aria-label="Result"></pre>
      <footer>Processed in memory. No documents are stored.</footer>
    </main>
  </body>
</html>
