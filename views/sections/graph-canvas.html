<section
  class="panel project-graph-panel"
  id="projects"
  aria-labelledby="projects-title"
>
  <div class="section-heading">
    <div>
      <h2 id="projects-title">Project graph</h2>
    </div>
    <span class="subtle-label" id="graph-status" role="status"
      >Loading demo workspace…</span
    >
  </div>
  <p class="graph-help" id="graph-help">
    Select a project to see its details and launch it. Drag nodes with a mouse
    or touch; use Tab to focus nodes and arrow keys to move them.
  </p>
  <div class="docker-readiness">
    <p class="instance-status" id="docker-status" role="status">
      Checking Docker and Compose…
    </p>
    <button class="button" id="docker-check" type="button" disabled>
      Check again
    </button>
  </div>
  <div
    class="graph-scroll"
    tabindex="0"
    role="region"
    aria-label="Scrollable project graph"
    aria-describedby="graph-help"
  >
    <div class="project-graph" id="project-graph">
      <svg class="graph-edges" viewBox="0 0 800 420" aria-hidden="true">
        <g class="workspace-edges"></g>
      </svg>
      <div class="graph-node workspace-node">
        <strong>Nucleus</strong><small>Demo workspace</small>
      </div>
    </div>
  </div>
  <div class="graph-legend" aria-label="Graph legend">
    <span><i aria-hidden="true"></i>Workspace</span>
    <span><i aria-hidden="true"></i>Project</span>
    <span><i aria-hidden="true"></i>Selected project</span>
  </div>
  <p class="graph-details" id="graph-details" aria-live="polite"></p>
  <section class="graph-instances" aria-labelledby="graph-instances-title">
    <h3 id="graph-instances-title">Selected project instances</h3>
    <ul class="instance-list" id="graph-instance-list"></ul>
  </section>
</section>
